# Un PostgreSQL local EFÍMERO. Cada corrida arranca desde cero.
#
# El MISMO archivo se usa en la máquina de desarrollo y en la integración
# continua. Con un bloque `services:` de GitHub Actions habría DOS descripciones
# del entorno y divergirían — y una divergencia entre entornos es exactamente lo
# que hace "que la prueba que debía fallar pase" (08-ENDURECIMIENTO § 11.5).

services:
  base:
    # La versión MAYOR tiene que coincidir con la del PostgreSQL administrado, y
    # ahora sabemos cuál es: **PostgreSQL 17.4**, medido contra el proyecto real
    # (`select version()` por la Management API), no supuesto.
    #
    # Estaba en 18 mientras el proveedor no existía. Bajarlo no es cosmético: hay
    # una defensa entera que se validó contra un comportamiento de 18. El
    # `docs/ETAPA-2.md` afirma que *"PostgreSQL 18 exige privilegio sobre todas las
    # columnas para cualquier referencia de fila completa, así que el permiso por
    # columna es hermético"*, y de eso depende que el inquilino no alcance
    # `identidad.usuarios.password_hash`. Con el contenedor en 18 y producción en
    # 17, la suite habría dado verde sobre una propiedad que en producción puede
    # no valer — la divergencia entre entornos que el encabezado de este archivo
    # nombra como *"exactamente lo que hace que la prueba que debía fallar pase"*.
    #
    # El parche queda sin fijar a propósito: Supabase actualiza el suyo y clavarlo
    # acá produciría una divergencia nueva en la dirección contraria.
    image: postgres:17-alpine
    # El nombre del contenedor es fijo para que los guiones lo puedan esperar sin
    # adivinar el prefijo que Compose le pone al proyecto.
    container_name: aria_base
    environment:
      # Solo del contenedor local. La contraseña real de cada rol de la
      # aplicación la pone `db/arranque/000_cluster.sql` desde el entorno.
      POSTGRES_PASSWORD: postgres_local
      POSTGRES_DB: aria
      # Determinismo: sin esto la imagen toma la localización del anfitrión y los
      # mensajes de error cambian de idioma entre máquinas — y hay pruebas que
      # afirman sobre el TEXTO de los errores de los disparadores.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      LANG: C
    ports:
      # 55432 y no 5432: no pisa un PostgreSQL que ya esté instalado en la
      # máquina. Atado a 127.0.0.1, no expuesto en la red.
      - "127.0.0.1:55432:5432"
    # SIN sección `volumes:` a propósito. La imagen declara su propio VOLUME y
    # Compose le crea uno anónimo que `docker compose down -v` se lleva entero.
    # Así no hay que adivinar dónde pone PGDATA cada versión de la imagen.
    healthcheck:
      # `pg_isready` sin más responde antes de que el arranque haya terminado de
      # reiniciar el servidor la primera vez. La consulta real es la única señal
      # confiable de "acepta conexiones de verdad".
      test: ["CMD-SHELL", "pg_isready -U postgres -d aria && psql -U postgres -d aria -c 'select 1' > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
