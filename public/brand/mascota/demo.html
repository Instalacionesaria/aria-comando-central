<!doctype html>
<html lang="es" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARIA · Mascota</title>
<link rel="stylesheet" href="../tokens.css">
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;background:var(--bg);color:var(--ink-3);font-family:var(--font-mono)}.row{display:flex;flex-wrap:wrap;gap:32px;justify-content:center}.row div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px}</style>
<script src="aria-mascot.js"></script></head>
<body>
<aria-mascot size="240" follow></aria-mascot>
<div class="row">
<div><aria-mascot size="96" state="neutral"></aria-mascot>neutral</div>
<div><aria-mascot size="96" state="pensando"></aria-mascot>pensando</div>
<div><aria-mascot size="96" state="escuchando"></aria-mascot>escuchando</div>
<div><aria-mascot size="96" state="hallazgo"></aria-mascot>hallazgo</div>
<div><aria-mascot size="96" state="celebra"></aria-mascot>celebra</div>
<div><aria-mascot size="96" state="alerta"></aria-mascot>alerta</div>
<div><aria-mascot size="96" state="cargando"></aria-mascot>cargando</div>
<div><aria-mascot size="96" state="sin-conexion"></aria-mascot>sin conexión</div>
<div><aria-mascot size="32"></aria-mascot>mínima (32px)</div>
</div>
</body></html>
